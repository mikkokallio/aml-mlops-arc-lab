$schema: https://azuremlschemas.azureedge.net/latest/kubernetesOnlineDeployment.schema.json
name: blue
type: kubernetes
endpoint_name: campaign-arc
model: azureml:campaign-xgboost:1
instance_type: lab-cpu
instance_count: 1
resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: "1"
    memory: 2Gi
scale_settings:
  type: default
request_settings:
  request_timeout_ms: 60000
liveness_probe:
  initial_delay: 30
  period: 10
  timeout: 2
  failure_threshold: 60
readiness_probe:
  initial_delay: 30
  period: 10
  timeout: 2
  failure_threshold: 60
