name: OIDC authentication and approval probe

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  train:
    name: Train control-plane authentication
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: train
    steps:
      - name: Authenticate with OIDC and read workspace state
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AML_WORKSPACE_RESOURCE_ID: ${{ secrets.AML_WORKSPACE_RESOURCE_ID }}
          AZURE_CONFIG_DIR: ${{ github.workspace }}/.azure-oidc
        run: |
          set -euo pipefail
          set +x
          umask 077
          trap 'az logout >/dev/null 2>&1 || true; rm -rf "$AZURE_CONFIG_DIR"' EXIT
          mkdir -p "$AZURE_CONFIG_DIR"
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID AML_WORKSPACE_RESOURCE_ID; do
            nonempty=false
            [[ -z "${!name}" ]] || nonempty=true
            printf 'Secret %s nonempty=%s\n' "$name" "$nonempty"
            if [[ -z "${!name}" ]]; then echo "::error::Missing required repository secret: $name"; exit 1; fi
          done
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID; do
            guid_valid=false
            [[ "${!name}" =~ ^[[:xdigit:]]{8}-[[:xdigit:]]{4}-[[:xdigit:]]{4}-[[:xdigit:]]{4}-[[:xdigit:]]{12}$ ]] && guid_valid=true
            printf 'Secret %s guid_format_valid=%s\n' "$name" "$guid_valid"
          done
          token="$(curl --fail --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=api%3A%2F%2FAzureADTokenExchange" | jq -er '.value')"
          echo "::add-mask::$token"
          printf '%s' "$token" | node -e '
            let token = "";
            process.stdin.on("data", chunk => { token += chunk; });
            process.stdin.on("end", () => {
              let claims = {};
              try {
                const decoded = JSON.parse(Buffer.from(token.split(".")[1], "base64url").toString("utf8"));
                if (decoded && typeof decoded === "object") claims = decoded;
              } catch {}
              const audience = "api://AzureADTokenExchange";
              const comparisons = {
                oidc_issuer_matches: claims.iss === "https://token.actions.githubusercontent.com",
                oidc_audience_matches: Array.isArray(claims.aud)
                  ? claims.aud.length === 1 && claims.aud[0] === audience
                  : claims.aud === audience,
                oidc_subject_main_ref_matches: claims.sub === "repo:mikkokallio/aml-mlops-arc-lab:ref:refs/heads/main",
                oidc_subject_train_environment_matches: claims.sub === "repo:mikkokallio/aml-mlops-arc-lab:environment:train",
                oidc_subject_prod_environment_matches: claims.sub === "repo:mikkokallio/aml-mlops-arc-lab:environment:prod",
                dispatched_ref_is_main: process.env.GITHUB_REF === "refs/heads/main"
              };
              for (const [name, matches] of Object.entries(comparisons)) {
                process.stdout.write(`${name}=${matches}\n`);
              }
            });
          '
          login_stderr="$AZURE_CONFIG_DIR/login.stderr"
          if az login --service-principal --username "$AZURE_CLIENT_ID" \
            --tenant "$AZURE_TENANT_ID" --federated-token "$token" \
            --output none --only-show-errors >/dev/null 2>"$login_stderr"; then
            printf 'stage=oidc_login exit_status=0\n'
          else
            login_status=$?
            unset token
            printf 'stage=oidc_login exit_status=%s\n' "$login_status"
            aadsts_codes="$(grep -oE 'AADSTS[0-9]+' "$login_stderr" | LC_ALL=C sort -u | paste -sd ',' - || true)"
            if [[ -n "$aadsts_codes" ]]; then
              printf 'AADSTS_codes=%s\n' "$aadsts_codes"
            else
              printf 'AADSTS_codes=none (no AADSTS code present)\n'
            fi
            echo "::error::OIDC Azure login failed (identifiers suppressed)."
            exit "$login_status"
          fi
          unset token
          if ! az account set --subscription "$AZURE_SUBSCRIPTION_ID" >/dev/null 2>&1; then
            echo "::error::Subscription selection failed (identifiers suppressed)."; exit 1
          fi
          if ! state="$(az rest --method get \
            --url "https://management.azure.com${AML_WORKSPACE_RESOURCE_ID}?api-version=2024-10-01" \
            --query properties.provisioningState --output tsv --only-show-errors 2>/dev/null)"; then
            echo "::error::Exact-workspace ARM read failed (identifiers suppressed)."; exit 1
          fi
          [[ "$state" =~ ^[A-Za-z]+$ ]] || { echo "::error::Missing or invalid provisioning state."; exit 1; }
          printf 'Workspace provisioning state: %s\n' "$state"

  prod:
    name: Prod control-plane authentication (lab self-approval permitted)
    needs: train
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: prod
    steps:
      - name: Authenticate with OIDC and read workspace state
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AML_WORKSPACE_RESOURCE_ID: ${{ secrets.AML_WORKSPACE_RESOURCE_ID }}
          AZURE_CONFIG_DIR: ${{ github.workspace }}/.azure-oidc
        run: |
          set -euo pipefail
          set +x
          umask 077
          trap 'az logout >/dev/null 2>&1 || true; rm -rf "$AZURE_CONFIG_DIR"' EXIT
          mkdir -p "$AZURE_CONFIG_DIR"
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID AML_WORKSPACE_RESOURCE_ID; do
            nonempty=false
            [[ -z "${!name}" ]] || nonempty=true
            printf 'Secret %s nonempty=%s\n' "$name" "$nonempty"
            if [[ -z "${!name}" ]]; then echo "::error::Missing required repository secret: $name"; exit 1; fi
          done
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID; do
            guid_valid=false
            [[ "${!name}" =~ ^[[:xdigit:]]{8}-[[:xdigit:]]{4}-[[:xdigit:]]{4}-[[:xdigit:]]{4}-[[:xdigit:]]{12}$ ]] && guid_valid=true
            printf 'Secret %s guid_format_valid=%s\n' "$name" "$guid_valid"
          done
          token="$(curl --fail --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=api%3A%2F%2FAzureADTokenExchange" | jq -er '.value')"
          echo "::add-mask::$token"
          printf '%s' "$token" | node -e '
            let token = "";
            process.stdin.on("data", chunk => { token += chunk; });
            process.stdin.on("end", () => {
              let claims = {};
              try {
                const decoded = JSON.parse(Buffer.from(token.split(".")[1], "base64url").toString("utf8"));
                if (decoded && typeof decoded === "object") claims = decoded;
              } catch {}
              const audience = "api://AzureADTokenExchange";
              const comparisons = {
                oidc_issuer_matches: claims.iss === "https://token.actions.githubusercontent.com",
                oidc_audience_matches: Array.isArray(claims.aud)
                  ? claims.aud.length === 1 && claims.aud[0] === audience
                  : claims.aud === audience,
                oidc_subject_main_ref_matches: claims.sub === "repo:mikkokallio/aml-mlops-arc-lab:ref:refs/heads/main",
                oidc_subject_train_environment_matches: claims.sub === "repo:mikkokallio/aml-mlops-arc-lab:environment:train",
                oidc_subject_prod_environment_matches: claims.sub === "repo:mikkokallio/aml-mlops-arc-lab:environment:prod",
                dispatched_ref_is_main: process.env.GITHUB_REF === "refs/heads/main"
              };
              for (const [name, matches] of Object.entries(comparisons)) {
                process.stdout.write(`${name}=${matches}\n`);
              }
            });
          '
          login_stderr="$AZURE_CONFIG_DIR/login.stderr"
          if az login --service-principal --username "$AZURE_CLIENT_ID" \
            --tenant "$AZURE_TENANT_ID" --federated-token "$token" \
            --output none --only-show-errors >/dev/null 2>"$login_stderr"; then
            printf 'stage=oidc_login exit_status=0\n'
          else
            login_status=$?
            unset token
            printf 'stage=oidc_login exit_status=%s\n' "$login_status"
            aadsts_codes="$(grep -oE 'AADSTS[0-9]+' "$login_stderr" | LC_ALL=C sort -u | paste -sd ',' - || true)"
            if [[ -n "$aadsts_codes" ]]; then
              printf 'AADSTS_codes=%s\n' "$aadsts_codes"
            else
              printf 'AADSTS_codes=none (no AADSTS code present)\n'
            fi
            echo "::error::OIDC Azure login failed (identifiers suppressed)."
            exit "$login_status"
          fi
          unset token
          if ! az account set --subscription "$AZURE_SUBSCRIPTION_ID" >/dev/null 2>&1; then
            echo "::error::Subscription selection failed (identifiers suppressed)."; exit 1
          fi
          if ! state="$(az rest --method get \
            --url "https://management.azure.com${AML_WORKSPACE_RESOURCE_ID}?api-version=2024-10-01" \
            --query properties.provisioningState --output tsv --only-show-errors 2>/dev/null)"; then
            echo "::error::Exact-workspace ARM read failed (identifiers suppressed)."; exit 1
          fi
          [[ "$state" =~ ^[A-Za-z]+$ ]] || { echo "::error::Missing or invalid provisioning state."; exit 1; }
          printf 'Workspace provisioning state: %s\n' "$state"
