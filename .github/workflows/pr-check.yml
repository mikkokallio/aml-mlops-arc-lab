name: PR checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pr-check:
    name: Python and AML contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      AZURE_CORE_COLLECT_TELEMETRY: "false"
      MLFLOW_ENABLE_SYSTEM_METRICS_LOGGING: "false"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install existing dependencies
        run: python -m pip install -r requirements.txt
      # No style/static-analysis linter is declared; enforce syntax and
      # unambiguous indentation with the standard library, not a new dependency.
      - name: Python syntax and indentation (stdlib)
        run: python -m pytest -q tests/test_ci_contract.py -k python_syntax_and_indentation
      - name: Unit tests including leakage rejection
        run: python -m pytest -q tests --ignore=tests/test_ci_contract.py
      - name: Committed feature contract and offline AML YAML schemas
        run: python -m pytest -q tests/test_ci_contract.py -k "not python_syntax_and_indentation"
      - name: OIDC bootstrap boundaries (mocked, no Azure access)
        shell: pwsh
        run: .\tests\Test-LabOidc.ps1
